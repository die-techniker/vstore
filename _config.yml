# Site settings
title: "VStore 2"
description: 'Ein kostenloser App-Store für Entwickler und Apple-Geräte-Nutzer'
url: 'https://die-techniker.github.io/vstore'
baseurl: ''
profilepic: '/images/tzuehlke.jpg'
bkimage: '/images/bk1.jpg'


author:
  name: 'VStore'

# Build settings
destination: _site
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

#plugins: ['jekyll-paginate']
exclude: ['README.md', 'screenshot-overview.png']
