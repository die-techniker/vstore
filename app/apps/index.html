<script>
    // 1. Das Element einmalig beim Browser registrieren
    class VStoreAppElement extends HTMLElement {
        constructor() {
            super();
        }
    }
    customElements.define('vstore-app', VStoreAppElement);

    // 2. ALLE <vstore-app> Elemente auf der Seite finden
    const alleApps = document.querySelectorAll('vstore-app');

    // 3. Jede einzelne App durchgehen und die Attribute auslesen
    alleApps.forEach((app, index) => {
        let name = app.getAttribute('name');
        let url = app.getAttribute('url');
        let sonstiges = app.getAttribute('sonstiges');
        let beschreibung = app.getAttribute('beschreibung');
        let kompatibilitaet = app.getAttribute('kompatibilität');
        let typ = app.getAttribute('typ');


        // Ausgabe in der Konsole zur Kontrolle
        console.log(`--- App #${index + 1} ---`);
        console.log(`Name: ${name}`);
        console.log(`Typ: ${typ}`);
        console.log(`Beschreibung: ${beschreibung}`);
        app.innerHTML = `
<h2><a href="${url}" style="text-decoration: none; background-color: #00ffff">${name}</a></h2>
    <h3 style="font-weight: normal; background-color: #81ffe6; font-color: #ffffff">Typ: ${typ}<br>Kompatibilität: ${kompatibilitaet}<br>Sonstiges: ${sonstiges}</h3>
    <h3 style="font-weight: normal; background-color: #81ffe6">${beschreibung}</h3>
        `;
    });
</script>
